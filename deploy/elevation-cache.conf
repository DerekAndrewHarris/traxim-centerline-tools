# systemd drop-in for traxim-file-generator: a persistent, writable folder
# for the elevation tile cache (Copernicus DEM, see backend/services/elevation.js).
#
# Install on the server (as root), ONCE:
#   cp elevation-cache.conf /etc/systemd/system/traxim-file-generator.service.d/elevation-cache.conf
#   systemctl daemon-reload && systemctl restart traxim-file-generator
#
# StateDirectory makes systemd create /var/lib/traxim-elevation (owned by the
# service's user, www-data) and keep it writable despite ProtectSystem=strict.
# The folder and its tiles survive reboots and restarts. About 20-40 MB per
# 1 x 1 degree tile.
[Service]
StateDirectory=traxim-elevation
StateDirectoryMode=0755
Environment=ELEVATION_CACHE_DIR=/var/lib/traxim-elevation
